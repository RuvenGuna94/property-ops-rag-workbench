receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  batch:
    timeout: 1s
    send_batch_size: 32
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    sending_queue:
      queue_size: 128
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
